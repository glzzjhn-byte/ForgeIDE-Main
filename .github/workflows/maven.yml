name: Java CI with Maven

# This triggers the action every time you push code to the 'main' or 'master' branch
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    # This boots up a cloud computer running the latest version of Windows
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'oracle'
        cache: maven

    - name: Build with Maven
      # This runs your exact build command on the cloud server!
      run: mvn clean package
